<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bemestar-web</title>
    <meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f8f2e9" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("bemestar-tema");
      if (t !== "claro" && t !== "escuro") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      }
      document.documentElement.dataset.tema = t;
    } catch (e) {}
  })();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
