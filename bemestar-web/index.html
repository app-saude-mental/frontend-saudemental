<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/respire.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Respire</title>
    <meta name="description" content="Seu espaço de bem-estar: diário, hábitos, sons da natureza e acompanhamento." />
    <meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f8f2e9" />
    <!-- PWA: instalação no Windows, Android e iPhone -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Respire" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("bemestar-tema");
      if (t !== "claro" && t !== "escuro") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      }
      document.documentElement.dataset.tema = t;
      // barra do navegador / app instalado na cor do tema
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && t === "escuro") meta.setAttribute("content", "#15191b");
    } catch (e) {}
  })();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
